[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "core-are-scenarios"
version = "0.1.0"
description = "CORE worlds registered as ARE scenarios"
requires-python = ">=3.10"
dependencies = ["meta-agents-research-environments==1.2.0", "llm-tool==1.0.7"]

[tool.setuptools]
packages = ["are_integration", "function_calling", "worlds"]

[project.entry-points."are.simulation.scenarios"]
core_are = "are_integration.registration:register_scenarios"
