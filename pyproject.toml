[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "core-are-scenarios"
version = "0.1.0"
description = "CORE worlds registered as ARE scenarios"
requires-python = ">=3.10"
dependencies = ["meta-agents-research-environments==1.2.0"]

[tool.setuptools]
packages = ["are_integration"]

[project.entry-points."are.simulation.scenarios"]
core_are = "are_integration.registration:register_scenarios"
